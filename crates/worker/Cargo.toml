[package]
name = "worker"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
sha2 = "0.10"
regex = "1"
walkdir = "2"
ignore = "0.4"
flate2 = "1"
tree-sitter-java = "0.23"
tree-sitter-go = "0.23"
tree-sitter-python = "0.23"
serde_yaml = "0.9"
